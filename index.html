<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Flow Timer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: #000; }
  html, body { height: 100%; color: #fff; overflow: hidden; }
  body {
    height: 100dvh;
    display: grid;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: ui-rounded, -apple-system, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; }
  /* Invisible: only lends its box, weight and font to the dot digits (and stays readable to screen readers). */
  #time { color: transparent; font-weight: 600; }
</style>
</head>
<body>
<canvas id="dots"></canvas>
<div id="time" role="timer">2:00</div>
<script>
const TOTAL = 120_000, PULSE = 30_000;
const $ = id => document.getElementById(id);
const timeEl = $('time'), cv = $('dots'), ctx = cv.getContext('2d');

// --- timer: wall-clock based, so it stays exact while rAF is paused or the phone sleeps ---
let remaining = TOTAL, endAt = null, pulses = 0, pulseAt = -1e9, wakeLock = null;
const left = now => endAt ? Math.max(0, Math.min(remaining, endAt - now)) : remaining;

function render(now) {
  const s = Math.ceil(left(now) / 1000);
  const txt = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  if (timeEl.textContent !== txt) timeEl.textContent = txt;
}

function tick(now) {
  if (!endAt) return;
  const l = left(now);
  const n = Math.floor((TOTAL - l) / PULSE);          // 30 s boundaries: 1:30, 1:00, 0:30, 0:00
  if (n > pulses) { if (TOTAL - n * PULSE - l < 1000) pulseAt = now; pulses = n; }   // skip flashes missed while hidden
  if (l === 0) { endAt = null; remaining = 0; navigator.vibrate?.(300); unlock(); }
  render(now);
}

async function lock() {
  try {
    const s = await navigator.wakeLock?.request('screen');
    if (endAt) { wakeLock?.release(); wakeLock = s; } else s?.release();   // timer may have stopped meanwhile
  } catch {}
}
function unlock() { wakeLock?.release(); wakeLock = null; }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && endAt) lock(); });

function start() {
  if (remaining === 0) { remaining = TOTAL; pulses = 0; }
  endAt = Date.now() + remaining;
  lock();
  document.documentElement.requestFullscreen?.()?.catch(() => {});
}
function pause() {
  const now = Date.now();
  tick(now);                                  // a timer that just hit 0:00 finishes instead of freezing
  if (!endAt) return;
  remaining = left(now); endAt = null; unlock(); render(now);
}
function reset() { endAt = null; remaining = TOTAL; pulses = 0; unlock(); render(Date.now()); }

// One tap starts/pauses (the digits blink to confirm). Three quick taps reset and light up every
// dot; the first two taps of the triple toggle and toggle back, so they cancel out.
let taps = 0, lastTap = 0, tapAt = -1e9;
addEventListener('click', () => {
  const now = Date.now();
  taps = now - lastTap < 400 ? taps + 1 : 1; lastTap = now;
  if (taps === 3) { reset(); pulseAt = now; taps = 0; }
  else { endAt ? pause() : start(); tapAt = now; }
});
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') endAt ? pause() : start();
  else if (e.key === 'r' || e.key === 'Escape') reset();
});

// --- dot grid: procedural flow field; every pulse lights all dots, then flow resumes ---
let W, H, cols, rows, S, UW, UH, mask, maskKey = '';
const mk = document.createElement('canvas').getContext('2d', { willReadFrequently: true });

function resize() {
  const dpr = devicePixelRatio || 1, r = cv.getBoundingClientRect();
  W = cv.width = Math.round(r.width * dpr); H = cv.height = Math.round(r.height * dpr);
  cols = Math.max(1, Math.round(r.width / 22)); rows = Math.max(1, Math.round(r.height / 22));
  S = r.width / cols / 22; UW = cols * S; UH = rows * S;
  maskKey = '';
}
addEventListener('resize', resize); resize();

// Rasterise the digits at SS×SS pixels per dot and average each block: `mask` then holds how much
// of every dot's cell the glyphs cover (0..1). Drawing text at one pixel per dot came out uneven
// on iOS, hence the supersampling. Digits get fixed-width slots so nothing jiggles.
const SS = 6;
function buildMask(key) {
  const txt = timeEl.textContent, mw = cols * SS, mh = rows * SS;
  const r = cv.getBoundingClientRect(), t = timeEl.getBoundingClientRect(), cs = getComputedStyle(timeEl);
  mk.canvas.width = mw; mk.canvas.height = mh;
  mk.setTransform(mw / r.width, 0, 0, mh / r.height, 0, 0);   // draw in CSS px
  mk.font = `${cs.fontWeight} 100px ${cs.fontFamily}`;
  const dw = Math.max(...[...'0123456789'].map(d => mk.measureText(d).width));
  const colon = mk.measureText(':').width, cap = mk.measureText('0').actualBoundingBoxAscent;
  const slot = c => c === ':' ? colon : dw;
  const w = [...txt].reduce((a, c) => a + slot(c), 0);
  const s = Math.min(t.width * 0.9 / w, t.height * 0.85 / cap);
  mk.font = `${cs.fontWeight} ${100 * s}px ${cs.fontFamily}`;
  mk.textAlign = 'center';
  let x = t.left - r.left + (t.width - w * s) / 2;
  const y = t.top - r.top + (t.height + cap * s) / 2;
  for (const c of txt) { mk.fillText(c, x + slot(c) * s / 2, y); x += slot(c) * s; }
  const px = mk.getImageData(0, 0, mw, mh).data;
  mask = new Float32Array(cols * rows);
  for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++)
    mask[(y / SS | 0) * cols + (x / SS | 0)] += px[(y * mw + x) * 4 + 3] / (255 * SS * SS);
  maskKey = key;
}

// --- flow algorithms (auto blends them all; ?algo=name pins one) ---
// x, y come in units of 22 CSS px so each pattern keeps its scale whatever the dot pitch. All return 0..1.
const c01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const ss = (a, b, v) => (v = c01((v - a) / (b - a)), v * v * (3 - 2 * v));

// Ken Perlin's improved 3D noise, reshuffled on every load. Returns roughly -1..1.
const P = new Uint8Array(512);
{ const p = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [p[i], p[j]] = [p[j], p[i]]; }
  for (let i = 0; i < 512; i++) P[i] = p[i & 255]; }
const fade = t => t * t * t * (t * (t * 6 - 15) + 10), lerp = (a, b, t) => a + t * (b - a);
const grad = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return (h & 1 ? -u : u) + (h & 2 ? -v : v); };
function noise(x, y, z) {
  const fx = Math.floor(x), fy = Math.floor(y), fz = Math.floor(z), X = fx & 255, Y = fy & 255, Z = fz & 255;
  x -= fx; y -= fy; z -= fz;
  const u = fade(x), v = fade(y), w = fade(z);
  const A = P[X] + Y, AA = P[A] + Z, AB = P[A + 1] + Z, B = P[X + 1] + Y, BA = P[B] + Z, BB = P[B + 1] + Z;
  return lerp(
    lerp(lerp(grad(P[AA], x, y, z), grad(P[BA], x - 1, y, z), u), lerp(grad(P[AB], x, y - 1, z), grad(P[BB], x - 1, y - 1, z), u), v),
    lerp(lerp(grad(P[AA + 1], x, y, z - 1), grad(P[BA + 1], x - 1, y, z - 1), u), lerp(grad(P[AB + 1], x, y - 1, z - 1), grad(P[BB + 1], x - 1, y - 1, z - 1), u), v),
    w);
}
const fbm = (x, y, z) => noise(x, y, z) + 0.5 * noise(2 * x, 2 * y, 2 * z) + 0.25 * noise(4 * x, 4 * y, 4 * z);

// 5 points wandering on Lissajous paths (used by gotas / metaballs), moved once per frame.
let SRC = [];
const moveSources = t => SRC = [0, 1, 2, 3, 4].map(k => [
  UW * (0.5 + 0.42 * Math.sin(t * (0.11 + 0.04 * k) + k * 1.7)), UH * (0.5 + 0.42 * Math.sin(t * (0.09 + 0.03 * k) + k * 2.9))]);

// Particles steered by a noise field, drifting right, each leaving a fading trail on the dot it crosses.
let trail = new Float32Array(0), parts = [];
function stepTrails(t, dt) {
  if (trail.length !== cols * rows) { trail = new Float32Array(cols * rows); parts = Array.from({ length: 300 }, () => [Math.random() * UW, Math.random() * UH]); }
  const f = dt * 60, decay = 0.95 ** f;
  for (let k = 0; k < trail.length; k++) trail[k] *= decay;
  for (const p of parts) {
    const a = noise(p[0] * 0.1, p[1] * 0.1, t * 0.05) * Math.PI * 3;
    p[0] += (Math.cos(a) * 0.08 + 0.03) * f; p[1] += Math.sin(a) * 0.08 * f;
    if (p[0] < 0 || p[0] >= UW || p[1] < 0 || p[1] >= UH || Math.random() < 0.002 * f) { p[0] = Math.random() * UW; p[1] = Math.random() * UH; }
    trail[(p[1] / S | 0) * cols + (p[0] / S | 0)] += 0.3 * f;
  }
}

const ALGOS = {
  ondas: (x, y, t) =>        // domain-warped sines; the drift outpaces the warp so bands only move downstream
    0.5 + 0.5 * Math.sin((x + y) * 0.45 + t * 0.9 + 0.5 * (Math.sin(x * 0.55 + t * 0.25) + Math.sin(y * 0.8 - t * 0.2))),
  humo: (x, y, t) => {       // noise bent by noise: smoke / ink in water
    const s = 0.09, z = t * 0.12, qx = noise(x * s, y * s, z), qy = noise(x * s + 5.2, y * s + 1.3, z);
    return c01(0.5 + 0.9 * fbm(x * s + 2.5 * qx, y * s + 2.5 * qy, z * 0.7));
  },
  corriente: (x, y, t) =>    // two noise layers carried steadily to the right at different speeds
    c01(0.5 + 0.8 * noise(x * 0.12 - t * 0.25, y * 0.12, t * 0.08) + 0.4 * noise(x * 0.3 - t * 0.6, y * 0.3, 7 + t * 0.15)),
  gotas: (x, y, t) => {      // ripples spreading from 3 wandering points
    let s = 0;
    for (let k = 0; k < 3; k++) s += Math.sin(Math.hypot(x - SRC[k][0], y - SRC[k][1]) * 1.1 - t * 2.2);
    return 0.5 + s / 6;
  },
  metaballs: (x, y) => {     // 5 soft blobs orbiting and merging
    let s = 0;
    for (const [cx, cy] of SRC) s += 10 / ((x - cx) ** 2 + (y - cy) ** 2 + 1);
    return ss(0.3, 1.1, s);
  },
  estelas: (x, y, t, idx) => Math.min(1, trail[idx]),
};
const names = Object.keys(ALGOS), modes = ['auto', ...names];
let algo = new URLSearchParams(location.search).get('algo');
if (!modes.includes(algo)) algo = 'auto';

// auto: a gaussian window slides along the (circular) algorithm list, one step every 30 s. Each
// algorithm weighs exp(-d²/2σ²) by its distance d to the window centre, so one holds ~20 s and
// then melts into the next over ~9 s. Bigger SIGMA = longer blends.
const SIGMA = 0.25;
function blend(t) {
  if (algo !== 'auto') return [[ALGOS[algo], 1]];
  const c = t / 30, n = names.length, out = [];
  let sum = 0;
  for (let k = 0; k < n; k++) {
    const d = ((k - c) % n + n + n / 2) % n - n / 2, w = Math.exp(-d * d / (2 * SIGMA * SIGMA));
    if (w > 0.01) { out.push([ALGOS[names[k]], w]); sum += w; }
  }
  return out.map(([fn, w]) => [fn, w / sum]);
}

let last = 0;
function frame(now) {
  const wall = Date.now();
  tick(wall);
  if (maskKey !== timeEl.textContent) buildMask(timeEl.textContent);
  const t = now / 1000, dt = Math.min(0.1, (now - last) / 1000), pulse = Math.max(0, 1 - (wall - pulseAt) / 1000) ** 2;
  const blink = Math.max(pulse, Math.max(0, 1 - (wall - tapAt) / 400) ** 2);   // digits also answer a tap
  last = now;
  moveSources(t);
  stepTrails(t, dt);                       // always, so trails are ready when estelas fades in
  const mix = blend(t);
  const cw = W / cols, ch = H / rows, maxR = Math.min(cw, ch) * 0.22;
  ctx.clearRect(0, 0, W, H);
  for (const digit of [false, true]) {
    ctx.fillStyle = '#fff';
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const idx = j * cols + i, m = mask[idx];
      if ((m > 0.2) !== digit) continue;
      let f = 0;
      for (const [fn, w] of mix) f += w * fn(i * S, j * S, t, idx);
      // digits flow between 70% and full (scaled by glyph coverage), the rest flows dim
      const v = digit ? m * (0.7 + 0.3 * f) : 0.5 * f;
      // digit hue sweeps the whole spectrum: a full turn every 60 s, a rainbow drift across
      // the screen, and the flow field bending it locally
      if (digit) ctx.fillStyle = `hsl(${(t * 6 + i * S * 4 + f * 90) % 360 | 0} 75% 68%)`;
      const k = v + (1 - v) * (digit ? blink : pulse);
      ctx.globalAlpha = 0.1 + 0.9 * k * k;
      ctx.beginPath();
      ctx.arc(cw * (i + .5), ch * (j + .5), maxR * (0.2 + 0.8 * k), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
